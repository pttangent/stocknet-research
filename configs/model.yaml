# Model configuration
model:
  # TGNN architecture
  tgnn:
    architecture: "GConvGRU"  # GConvGRU | GConvLSTM
    node_feature_dim: 9
    hidden_dim: 64
    num_gnn_layers: 2
    edge_feature_dim: 5
    sequence_length: 8
    K: 2  # Chebyshev filter order

  # Training
  training:
    epochs: 20
    learning_rate: 0.001
    batch_size: 1
    train_fraction: 0.6
    validation_fraction: 0.2
    device: "cuda"

  # Tasks
  tasks:
    - "edge_persistence"
    - "community_survival"
    - "node_migration"

  # XGBoost baseline
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
