name: StockNetV2 graph quality report

on:
  pull_request:
    paths:
      - "StockNetV2/src/**"
      - "StockNetV2/tests/**"
      - "StockNetV2/pyproject.toml"
      - ".github/workflows/stocknetv2-graph-quality-report.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StockNetV2
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          sparse-checkout: |
            StockNetV2/src
            StockNetV2/tests
            StockNetV2/pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e . pytest
      - name: Run tests and create report
        run: python -m pytest tests/test_dtw_similarity.py tests/test_remaining_graph_layers.py tests/test_return_corr_graph.py tests/test_layer_execution_service.py tests/test_community_and_consensus.py -q --junitxml=graph-quality-junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-quality-junit
          path: StockNetV2/graph-quality-junit.xml
          if-no-files-found: error
          retention-days: 7
