name: StockNetV2 graph quality PR debug

on:
  pull_request:
    paths:
      - "StockNetV2/**"
      - ".github/workflows/stocknetv2-graph-quality-pr-debug.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StockNetV2
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e . pytest
      - run: python -m pytest tests/test_dtw_similarity.py tests/test_remaining_graph_layers.py tests/test_return_corr_graph.py tests/test_layer_execution_service.py tests/test_community_and_consensus.py -q
